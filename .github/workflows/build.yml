name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Gerar ícone
        run: |
          mkdir -p assets
          cp icon-only.png assets/icon-only.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#2b2b2b' --iconBackgroundColorDark '#2b2b2b'
      - name: Forçar tela deitada
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ArenaCraft-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
